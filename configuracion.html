<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Configurar campos — Almenara</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <p><a href="index.html">&larr; Volver a clientes</a></p>
  <h1>Configurar campos</h1>
  <p class="mensaje">Estos campos aparecen en la ficha de cada cliente, además de nombre, rubro y etapa (esos tres son fijos, los usa también el bot de Telegram).</p>

  <div id="lista-campos"></div>

  <h2>Agregar campo</h2>
  <div class="tarjeta">
    <div class="campo">
      <label>Nombre del campo</label>
      <input id="nueva-etiqueta" type="text" placeholder="Ej: Teléfono" />
    </div>
    <div class="campo">
      <label>Tipo</label>
      <select id="nuevo-tipo">
        <option value="texto">Texto</option>
        <option value="numero">Número</option>
        <option value="seleccion">Selección (opciones fijas)</option>
      </select>
    </div>
    <div class="campo" id="campo-opciones" style="display:none">
      <label>Opciones (separadas por coma)</label>
      <input id="nuevas-opciones" type="text" placeholder="Ej: Bajo, Medio, Alto" />
    </div>
    <button id="btn-agregar">+ Agregar campo</button>
    <p id="config-mensaje" class="mensaje"></p>
  </div>

  <script type="module" src="js/configuracion.js"></script>
</body>
</html>
