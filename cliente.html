<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Ficha de cliente — Almenara</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <p><a href="index.html">&larr; Volver a la lista</a></p>

  <div id="ficha" class="tarjeta">
    <h1><input id="nombre" type="text" /></h1>
    <p id="recencia-cliente" class="recencia"></p>
    <div class="campo">
      <label>Rubro</label>
      <input id="rubro" type="text" />
    </div>
    <div class="campo">
      <label>Etapa</label>
      <select id="etapa">
        <option value="prospecto">Prospecto</option>
        <option value="diagnostico">Diagnóstico</option>
        <option value="cliente">Cliente</option>
        <option value="descartado">Descartado</option>
      </select>
    </div>

    <div id="campos-extra"></div>

    <button id="btn-guardar">Guardar</button>
    <p id="guardado-mensaje" class="mensaje"></p>
  </div>

  <h2>Notas</h2>
  <ul id="lista-notas" class="linea-tiempo"></ul>

  <div class="campo">
    <label for="nota-nueva">Agregar nota</label>
    <textarea id="nota-nueva" rows="3"></textarea>
  </div>
  <button id="btn-agregar-nota">Agregar nota</button>
  <p id="nota-mensaje" class="mensaje"></p>

  <h2>Zona de peligro</h2>
  <button id="btn-eliminar-cliente" class="peligro">Eliminar cliente</button>
  <p id="eliminar-mensaje" class="mensaje error" style="display: none;"></p>

  <script type="module" src="js/cliente.js"></script>
</body>
</html>
